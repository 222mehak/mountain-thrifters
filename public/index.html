<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:site_name" content="The Mountain Thrifters">
<meta name="theme-color" content="#111312">
<title>The Mountain Thrifters · Thrifted outdoor gear from Manali</title>
<meta name="description" content="Thrifted jackets, boots, backpacks, tents and trek essentials from Manali. One of each, nothing new made, delivered across India.">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#111312;--ink:#EDEBE4;--mute:#A9ADA6;--dim:#8E938C;--pop:#E8623A;--s1:#181B19;--s2:#222623;--line:#262A27;--edge:#3A3F3B;--head:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.6}
a{color:inherit}
img{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pop);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
h1,h2,h3{font-family:var(--head);font-weight:600;text-transform:uppercase;line-height:1;margin:0;letter-spacing:.005em}
h1{font-size:clamp(44px,7vw,72px)}
h2{font-size:clamp(34px,5vw,52px)}
h3{font-size:26px}
.eye{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--pop)}
.mute{color:var(--mute)}
.dim{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--pop);border-color:var(--pop);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn.pop{background:var(--pop);border-color:var(--pop)}
.btn.pop:hover{background:var(--ink);border-color:var(--ink)}
.btn.wa{background:#25D366;border-color:#25D366;color:#0B2A16}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}

header.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--head);font-weight:600;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1;white-space:nowrap}
.top nav{display:flex;gap:32px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.top nav a{text-decoration:none;padding:14px 0;white-space:nowrap}
.top nav a:hover,.top nav a.on{color:var(--pop)}
.notice{background:var(--s1);border-bottom:1px solid var(--line);color:var(--mute);font-size:13px;text-align:center;padding:8px 16px}

.hero{position:relative;min-height:min(78vh,720px);display:flex;align-items:flex-end;background:linear-gradient(160deg,#2A2F2B 0%,#191C1A 55%,#111312 100%);background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,19,18,.15) 0%,rgba(17,19,18,.82) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-top:120px;padding-bottom:64px}
.hero h1{font-size:clamp(56px,10vw,128px);line-height:.92;margin:14px 0 18px}
.hero p{max-width:30em;margin:0 0 28px;font-size:18px;color:#D9DBD4}
.row{display:flex;flex-wrap:wrap;gap:12px}

section{padding:88px 0}
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px}
.shead h2{margin-top:10px}
.more{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-underline-offset:6px;padding:12px 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--s1);padding:14px 14px 20px;display:flex;flex-direction:column;gap:6px;text-decoration:none;min-width:0}
.ph{position:relative;aspect-ratio:4/5;background:var(--s2);margin-bottom:10px;overflow:hidden;display:flex;align-items:flex-end;padding:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7D827B}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .ph img{transform:scale(1.03)}
.card .b{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--pop);min-height:1.6em}
.card .n{font-size:17px;line-height:1.35}
.card .m{font-size:14px;color:var(--dim)}
.card .p{margin-top:4px}
.card .v{margin-top:8px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card:hover .v{color:var(--ink)}
.card.sold .b,.card.sold .n,.card.sold .p,.card.sold .v{color:#6F756F}
.card.sold .p{text-decoration:line-through}
.card.sold .ph::after{content:"";position:absolute;inset:0;background:rgba(17,19,18,.62)}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);z-index:1;border:2px solid var(--ink);color:var(--ink);padding:8px 22px;font-family:var(--head);font-weight:600;font-size:30px;letter-spacing:.12em;line-height:1}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.cats a{background:var(--bg);padding:26px 24px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-height:120px}
.cats a:hover{background:var(--s1)}
.cats a:hover h3{color:var(--pop)}
.cats span{font-size:14px;color:var(--dim)}
.band{background:var(--pop);color:#111312}
.band .wrap{display:flex;flex-wrap:wrap;gap:32px 64px;align-items:flex-end;justify-content:space-between}
.band h2{font-size:clamp(44px,7vw,88px);max-width:9em}
.band p{max-width:26em;margin:0;font-size:18px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.cols div{border-top:1px solid var(--line);padding-top:20px}
.cols p{margin:10px 0 0;color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:start}
.ig{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ig a{aspect-ratio:1;background:var(--s2);overflow:hidden}
.ig img{width:100%;height:100%;object-fit:cover}
.ig.big{grid-template-columns:repeat(4,minmax(0,1fr))}
footer{border-top:1px solid var(--line);padding:40px 0 56px;color:var(--dim);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between}
footer a{text-underline-offset:4px}

.page{padding-top:56px;padding-bottom:96px}
.shop{display:flex;gap:48px;align-items:flex-start}
.filters{flex:0 0 220px}
.filters summary{display:none}
.fg{margin-bottom:26px}
.fl{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.fo{display:flex;flex-direction:column;align-items:flex-start}
.fo button{background:none;border:0;padding:0;min-height:40px;cursor:pointer;color:var(--dim);text-align:left}
.fo button.sub{padding-left:14px;font-size:15px}
.fo button:hover{color:var(--ink)}
.fo button.on{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-width:48px;min-height:44px;padding:0 12px;font-size:14px;cursor:pointer;background:transparent;border:1px solid var(--edge)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.results{flex:1;min-width:0}
.empty{border-top:1px solid var(--line);padding:28px 0;color:var(--mute)}

.pdp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
.gal{display:grid;gap:8px}
.gal .ph{margin:0}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.thumbs button{padding:0;border:1px solid transparent;background:var(--s2);aspect-ratio:1;cursor:pointer;overflow:hidden}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pdp h1{font-size:clamp(38px,5vw,56px);margin:10px 0 14px}
.price{font-size:22px}
dl.facts{margin:26px 0;border-top:1px solid var(--line)}
dl.facts div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
dl.facts dt{color:var(--dim)}
dl.facts dd{margin:0;text-align:right}
.back{display:inline-block;margin-bottom:24px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:10px 0}
.back:hover{color:var(--ink)}

.narrow{max-width:640px}
.item{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.item .ph{width:72px;flex:none;margin:0;padding:0}
.item .g{flex:1;min-width:0}
.item button{background:none;border:0;color:var(--dim);cursor:pointer;min-height:44px;text-decoration:underline;text-underline-offset:4px}
.total{display:flex;justify-content:space-between;padding:20px 0;font-size:20px}
label{display:block;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:18px 0 6px}
input,textarea,select{width:100%;background:var(--s1);border:1px solid var(--edge);padding:13px 14px;border-radius:0;font-size:16px}
textarea{min-height:96px;resize:vertical}
.err{color:#FF9B7A;margin:16px 0 0}
.step{background:var(--s1);padding:22px;margin-top:16px}
.step .fl{margin-bottom:8px}
.step p{margin:0 0 16px}
.upi{font-size:18px;word-break:break-all}

@media (max-width:900px){
.wrap{padding:0 16px}
.top .wrap{flex-direction:column;align-items:stretch;gap:0;padding-top:12px;padding-bottom:0}
.top nav{gap:22px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.top nav::-webkit-scrollbar{display:none}
section{padding:60px 0}
.hero .wrap{padding-bottom:40px}
.grid,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{padding:8px 8px 14px}
.card .n{font-size:15px}
.cats{grid-template-columns:repeat(2,minmax(0,1fr))}
.cats a{padding:18px 16px;min-height:100px}
.cols{grid-template-columns:1fr;gap:24px}
.two,.pdp{grid-template-columns:1fr;gap:32px}
.ig{grid-template-columns:repeat(3,minmax(0,1fr))}
.ig.big{grid-template-columns:repeat(2,minmax(0,1fr))}
.shop{flex-direction:column;gap:20px}
.filters{flex:none;width:100%;border:1px solid var(--edge)}
.filters summary{display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:0 16px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;list-style:none}
.filters summary::-webkit-details-marker{display:none}
.filters .in{padding:8px 16px 16px}
.page{padding-top:36px;padding-bottom:72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
<div class="wrap">
<a class="brand" href="/" data-link><svg width="30" height="28" viewBox="8 -8 384 352" aria-hidden="true"><path d="M200 76V58C200 44 222 47 222 28 222 13 211 4 198 4 186 4 176 13 176 25" fill="none" stroke="#EDEBE4" stroke-width="20" stroke-linecap="round"/><path d="M200 76 34 300Q20 326 50 326H350Q380 326 366 300Z" fill="none" stroke="#EDEBE4" stroke-width="20" stroke-linejoin="round"/><path d="M200 108 162 160 182 170 200 150 218 170 238 160Z" fill="#E8623A"/></svg>The Mountain Thrifters</a>
<nav aria-label="Main">
<a href="/shop" data-link data-nav="shop">Shop gear</a>
<a href="/#story" data-link data-nav="story">Our story</a>
<a href="/sell" data-link data-nav="sell">Sell with us</a>
<a href="/feed" data-link data-nav="feed">Instagram</a>
<a href="/bag" data-link data-nav="bag">Bag (<span id="bagn">0</span>)</a>
</nav>
</div>
</header>
<div id="notice"></div>
<main id="app"><div class="wrap page mute">Loading the gear room…</div></main>
<footer>
<div class="wrap">
<div>The Mountain Thrifters, Manali, Himachal Pradesh.<br>Thrifted outdoor gear. One of each. Nothing new made.</div>
<div><a href="https://www.instagram.com/mountain_thrifters/" target="_blank" rel="noopener">Instagram @mountain_thrifters</a><br><a href="#" id="fwa" target="_blank" rel="noopener">Message us on WhatsApp</a></div>
</div>
</footer>

<script>
(function(){
var S={products:[],cats:[],wa:'919317568898',ig:null,igNext:'',loaded:false,done:null};
var app=document.getElementById('app');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rs(n){return 'Rs '+Number(n||0).toLocaleString('en-IN');}
function waLink(text){return 'https://wa.me/'+S.wa+'?text='+encodeURIComponent(text);}

// ----- bag (kept on this device) -----
function bag(){try{var v=JSON.parse(localStorage.getItem('mt_bag')||'[]');return Array.isArray(v)?v.map(String):[];}catch(e){return [];}}
function setBag(ids){try{localStorage.setItem('mt_bag',JSON.stringify(ids));}catch(e){}bagCount();}
function bagItems(){var ids=bag();return S.products.filter(function(p){return ids.indexOf(p.id)>-1&&!p.sold;});}
function bagCount(){document.getElementById('bagn').textContent=S.loaded?bagItems().length:bag().length;}

// ----- data -----
function load(){
  return Promise.all([
    fetch('/api/products').then(function(r){return r.json();}).catch(function(){return [];}),
    fetch('/api/config').then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(a){
    S.products=Array.isArray(a[0])?a[0]:[];
    S.cats=(a[1]&&a[1].categories)||[];
    if(a[1]&&a[1].whatsapp)S.wa=a[1].whatsapp;
    S.loaded=true;
    document.getElementById('fwa').href=waLink('Hi Mountain Thrifters!');
    document.getElementById('notice').innerHTML=S.products.some(function(p){return p.sample;})?'<div class="notice">We are stocking the shelves. The pieces shown for now are samples.</div>':'';
    bagCount();
  });
}
function loadIg(after){
  return fetch('/api/instagram'+(after?'?after='+encodeURIComponent(after):'')).then(function(r){return r.json();}).then(function(d){
    S.ig=(after&&S.ig?S.ig:[]).concat(d.posts||[]);S.igNext=d.next||'';
  }).catch(function(){if(!S.ig)S.ig=[];});
}

// ----- pieces -----
function pic(p,src){
  var s=src||p.photo;
  return '<div class="ph">'+(s?'<img src="'+esc(s)+'" alt="'+esc((p.brand?p.brand+' ':'')+p.name)+'" loading="lazy">':esc(p.sub||p.category||'Photo soon'))+(p.sold?'<span class="stamp">SOLD</span>':'')+'</div>';
}
function meta(p){return [p.size,p.condition].filter(Boolean).map(esc).join(' · ');}
function card(p){
  return '<a class="card'+(p.sold?' sold':'')+'" href="/p/'+encodeURIComponent(p.id)+'" data-link>'+pic(p)+
    '<div class="b">'+esc(p.brand||'')+'</div><div class="n">'+esc(p.name)+'</div><div class="m">'+meta(p)+'</div>'+
    '<div class="p">'+rs(p.price)+'</div><div class="v">'+(p.sold?'Gone':'View item')+'</div></a>';
}
function soldLast(list){return list.filter(function(p){return !p.sold;}).concat(list.filter(function(p){return p.sold;}));}

// ----- home -----
function home(){
  var fresh=soldLast(S.products).slice(0,4);
  var cats=S.cats.slice(0,6).map(function(c){
    return '<a href="/shop?cat='+encodeURIComponent(c.name)+'" data-link><h3>'+esc(c.name)+'</h3><span>'+esc((c.subs||[]).slice(0,3).join(', '))+'</span></a>';
  }).join('');
  app.innerHTML=
  '<div class="hero" id="hero"><div class="wrap"><div class="eye">Thrifted in Manali. Delivered across India.</div>'+
  '<h1>Old gear.<br>New heights.</h1><p>Jackets, boots, packs and tents from the brands you know, at thrift prices. One of each.</p>'+
  '<div class="row"><a class="btn pop" href="/shop?for=Men" data-link>Shop men\'s</a><a class="btn" href="/shop?for=Women" data-link>Shop women\'s</a><a class="btn ghost" href="/shop" data-link>Shop all</a></div></div></div>'+
  '<section><div class="wrap"><div class="shead"><div><div class="eye">Just landed</div><h2>New in the gear room</h2></div><a class="more" href="/shop" data-link>See everything</a></div>'+
  (fresh.length?'<div class="grid">'+fresh.map(card).join('')+'</div>':'<div class="empty">New pieces land every week. Check back soon.</div>')+'</div></section>'+
  (cats?'<section style="padding-top:0"><div class="wrap"><div class="shead"><div><div class="eye">Everything for the trail</div><h2>Shop by category</h2></div></div><div class="cats">'+cats+'</div></div></section>':'')+
  '<section class="band"><div class="wrap"><h2>Less landfill. More land to explore.</h2><p>Every piece here has already been made. Buying it thrifted keeps good gear on the mountain and out of the dump.</p></div></section>'+
  '<section id="story"><div class="wrap two"><div><div class="eye">Our story</div><h2 style="margin-top:10px">Started on a rack in Manali</h2></div>'+
  '<div class="mute"><p style="margin-top:0">We started by hunting down good outdoor gear and selling it on Instagram to people heading up the valley. The rack kept emptying, so we built a proper shop.</p>'+
  '<p>Every piece is checked by hand, photographed as it is, and listed once. When it is gone, it is gone.</p><p style="margin-bottom:0">We ship anywhere in India.</p></div></div></section>'+
  '<section style="padding-top:0"><div class="wrap"><div class="shead"><div><div class="eye">Sell with us</div><h2>Got gear sitting idle?</h2></div><a class="btn ghost" href="/sell" data-link>Sell your gear</a></div>'+
  '<div class="cols"><div><h3>1. Send photos</h3><p>Tell us what you have. One jacket or a whole lot.</p></div><div><h3>2. Get an offer</h3><p>We reply on WhatsApp with a price.</p></div><div><h3>3. Get paid</h3><p>We pay by UPI and give it a second life.</p></div></div></div></section>'+
  '<section style="padding-top:0" id="igrow" hidden><div class="wrap"><div class="shead"><div><div class="eye">@mountain_thrifters</div><h2>On Instagram</h2></div><a class="more" href="/feed" data-link>See the feed</a></div><div class="ig" id="igr"></div></div></section>';
  var im=new Image();im.onload=function(){var h=document.getElementById('hero');if(h)h.style.backgroundImage='url(/photos/hero.jpg)';};im.src='/photos/hero.jpg';
  (S.ig?Promise.resolve():loadIg('')).then(function(){
    var el=document.getElementById('igr');if(!el||!S.ig.length)return;
    el.innerHTML=S.ig.slice(0,6).map(igTile).join('');document.getElementById('igrow').hidden=false;
  });
}
function igTile(p){return '<a href="'+esc(p.link)+'" target="_blank" rel="noopener"><img src="'+esc(p.image)+'" alt="'+esc((p.caption||'Instagram post').slice(0,90))+'" loading="lazy"></a>';}

// ----- shop -----
var KEYS=['for','cat','sub','brand','size','cond','sort'];
function getF(){var q=new URLSearchParams(location.search),f={};KEYS.forEach(function(k){f[k]=q.get(k)||'';});return f;}
function setF(f){var q=new URLSearchParams();KEYS.forEach(function(k){if(f[k])q.set(k,f[k]);});var s=q.toString();history.replaceState(null,'','/shop'+(s?'?'+s:''));shop(true);}
function match(p,f,skip){
  if(skip!=='for'&&f['for']&&p.gender&&p.gender!=='Everyone'&&p.gender!==f['for'])return false;
  if(skip!=='cat'&&f.cat&&p.category!==f.cat)return false;
  if(skip!=='cat'&&f.sub&&p.sub!==f.sub)return false;
  if(skip!=='brand'&&f.brand&&p.brand!==f.brand)return false;
  if(skip!=='size'&&f.size&&p.size!==f.size)return false;
  if(skip!=='cond'&&f.cond&&p.condition!==f.cond)return false;
  return true;
}
function uniq(list,k){var o=[];list.forEach(function(p){if(p[k]&&o.indexOf(p[k])<0)o.push(p[k]);});return o;}
function opt(key,val,label,on,cls){return '<button type="button" class="'+(cls||'')+(on?' on':'')+'" data-f="'+key+'" data-v="'+esc(val)+'" aria-pressed="'+(on?'true':'false')+'">'+esc(label)+'</button>';}
function group(label,body,chips){return '<div class="fg"><div class="fl">'+label+'</div><div class="'+(chips?'chips':'fo')+'">'+body+'</div></div>';}
function shop(keepOpen){
  var f=getF(),all=S.products;
  var list=all.filter(function(p){return match(p,f);});
  if(f.sort==='low')list.sort(function(a,b){return a.price-b.price;});
  if(f.sort==='high')list.sort(function(a,b){return b.price-a.price;});
  list=soldLast(list);
  var catNames=S.cats.map(function(c){return c.name;});
  uniq(all,'category').forEach(function(c){if(catNames.indexOf(c)<0)catNames.push(c);});
  var catHtml=opt('cat','','All',!f.cat);
  catNames.forEach(function(c){
    catHtml+=opt('cat',c,c,f.cat===c);
    if(f.cat===c){var cc=S.cats.filter(function(x){return x.name===c;})[0];((cc&&cc.subs)||[]).forEach(function(s){catHtml+=opt('sub',s,s,f.sub===s,'sub');});}
  });
  var brands=uniq(all.filter(function(p){return match(p,f,'brand');}),'brand').sort();
  var sizes=uniq(all.filter(function(p){return match(p,f,'size');}),'size');
  var conds=['Barely worn','Worn in','Well loved'];
  var active=KEYS.filter(function(k){return f[k]&&k!=='sort';}).length;
  var was=document.getElementById('filters');
  var open=keepOpen&&was?was.open:window.innerWidth>900;
  app.innerHTML='<div class="wrap page"><div class="shead"><div><div class="eye">The gear room</div><h1 style="margin-top:10px">'+esc(f.cat||(f['for']?f['for']+"'s gear":'Shop gear'))+'</h1></div><div class="dim" aria-live="polite">'+list.length+' of '+all.length+' pieces</div></div>'+
  '<div class="shop"><details class="filters" id="filters"'+(open?' open':'')+'><summary><span>Filter and sort'+(active?' ('+active+')':'')+'</span><span aria-hidden="true">+</span></summary><div class="in">'+
  group('Sort by',opt('sort','','Newest',!f.sort)+opt('sort','low','Price: low to high',f.sort==='low')+opt('sort','high','Price: high to low',f.sort==='high'))+
  group('For',opt('for','','Everyone',!f['for'])+opt('for','Men',"Men's",f['for']==='Men')+opt('for','Women',"Women's",f['for']==='Women'))+
  group('Category',catHtml)+
  (brands.length?group('Brand',opt('brand','','All',!f.brand)+brands.map(function(b){return opt('brand',b,b,f.brand===b);}).join('')):'')+
  (sizes.length?group('Size',opt('size','','All',!f.size)+sizes.map(function(s){return opt('size',s,s,f.size===s);}).join(''),true):'')+
  group('Condition',opt('cond','','All',!f.cond)+conds.map(function(c){return opt('cond',c,c,f.cond===c);}).join(''))+
  '<button type="button" class="btn ghost" data-clear>Clear filters</button></div></details>'+
  '<div class="results">'+(list.length?'<div class="grid three">'+list.map(card).join('')+'</div>':'<div class="empty">Nothing matches those filters right now. New pieces land every week.</div>')+'</div></div></div>';
}

// ----- one piece -----
function product(id){
  var p=S.products.filter(function(x){return x.id===id;})[0];
  if(!p){app.innerHTML='<div class="wrap page"><h1>This piece is gone</h1><p class="mute">It may have sold or been taken down.</p><a class="btn" href="/shop" data-link>Back to the shop</a></div>';return;}
  var photos=(p.photos&&p.photos.length?p.photos:(p.photo?[p.photo]:[]));
  var inBag=bag().indexOf(p.id)>-1;
  var facts=[['Brand',p.brand],['Size',p.size],['Condition',p.condition],['Category',[p.category,p.sub].filter(Boolean).join(' / ')],['For',p.gender]].filter(function(r){return r[1];});
  app.innerHTML='<div class="wrap page"><a class="back" href="/shop" data-link>Back to the shop</a><div class="pdp"><div class="gal"><div id="mainpic">'+pic(p,photos[0])+'</div>'+
  (photos.length>1?'<div class="thumbs">'+photos.map(function(s,i){return '<button type="button" data-pic="'+esc(s)+'" class="'+(i?'':'on')+'" aria-label="Photo '+(i+1)+'"><img src="'+esc(s)+'" alt=""></button>';}).join('')+'</div>':'')+'</div>'+
  '<div><div class="eye">'+esc(p.brand||'One of one')+'</div><h1>'+esc(p.name)+'</h1><div class="price">'+rs(p.price)+'</div>'+
  '<dl class="facts">'+facts.map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd></div>';}).join('')+'</dl>'+
  (p.description?'<p class="mute">'+esc(p.description)+'</p>':'')+
  (p.sold?'<button class="btn wide" disabled>Sold</button><p class="dim">This one found a home. <a href="/shop" data-link>See what is still here.</a></p>'
    :inBag?'<a class="btn wide pop" href="/bag" data-link>In your bag. View bag</a>'
    :'<button class="btn wide" type="button" data-add="'+esc(p.id)+'">Add to bag</button>')+
  '<p class="dim" style="font-size:14px">One of one. Thrifted, checked by hand and shipped from Manali across India.'+(p.link?' <a href="'+esc(p.link)+'" target="_blank" rel="noopener">See it on Instagram.</a>':'')+'</p></div></div></div>';
}

// ----- bag and checkout -----
function line(p){return '<div class="item">'+pic(p)+'<div class="g"><div>'+esc((p.brand?p.brand+' ':'')+p.name)+'</div><div class="dim" style="font-size:14px">'+meta(p)+'</div></div><div>'+rs(p.price)+'</div></div>';}
function sum(items){return items.reduce(function(s,p){return s+Number(p.price||0);},0);}
function bagView(){
  var items=bagItems();
  if(!items.length){app.innerHTML='<div class="wrap page"><div class="narrow"><h1>Your bag is empty</h1><p class="mute">Every piece is one of one, so grab it when you see it.</p><a class="btn" href="/shop" data-link>Shop gear</a></div></div>';return;}
  app.innerHTML='<div class="wrap page"><div class="narrow"><h1>Your bag</h1><div style="margin-top:24px">'+items.map(function(p){
    return '<div class="item">'+pic(p)+'<div class="g"><div>'+esc((p.brand?p.brand+' ':'')+p.name)+'</div><div class="dim" style="font-size:14px">'+meta(p)+'</div><button type="button" data-remove="'+esc(p.id)+'">Remove</button></div><div>'+rs(p.price)+'</div></div>';
  }).join('')+'</div><div class="total"><span>Total</span><span>'+rs(sum(items))+'</span></div><a class="btn wide" href="/checkout" data-link>Checkout</a><p class="dim" style="font-size:14px">Pay by UPI. We confirm on WhatsApp and ship from Manali.</p></div></div>';
}
function checkout(msg){
  var items=bagItems();
  if(!items.length){bagView();return;}
  app.innerHTML='<div class="wrap page"><div class="narrow"><a class="back" href="/bag" data-link>Back to bag</a><h1>Checkout</h1><div style="margin-top:20px">'+items.map(line).join('')+'</div><div class="total"><span>Total</span><span>'+rs(sum(items))+'</span></div>'+
  '<form id="co" novalidate><label for="c-name">Full name</label><input id="c-name" name="name" autocomplete="name" required>'+
  '<label for="c-phone">Mobile number (10 digits)</label><input id="c-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" required>'+
  '<label for="c-address">Delivery address</label><textarea id="c-address" name="address" autocomplete="street-address" required></textarea>'+
  '<label for="c-city">City</label><input id="c-city" name="city" autocomplete="address-level2">'+
  '<label for="c-pin">Pincode</label><input id="c-pin" name="pincode" inputmode="numeric" autocomplete="postal-code" required>'+
  '<p class="err" id="coerr" role="alert">'+esc(msg||'')+'</p><button class="btn wide" style="margin-top:16px">Place order</button>'+
  '<p class="dim" style="font-size:14px">Next step: send the order to us on WhatsApp and pay by UPI.</p></form></div></div>';
}
function placeOrder(form){
  var d=new FormData(form),btn=form.querySelector('button'),err=document.getElementById('coerr');
  var body={items:bagItems().map(function(p){return p.id;}),name:d.get('name'),phone:d.get('phone'),address:d.get('address'),city:d.get('city'),pincode:d.get('pincode')};
  btn.disabled=true;btn.textContent='Placing your order…';err.textContent='';
  fetch('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(res){
    if(!res.ok){
      if(res.j.error==='sold'||res.j.error==='unknown'){load().then(function(){setBag(bagItems().map(function(p){return p.id;}));checkout(res.j.message);});return;}
      err.textContent=res.j.message||'Could not place the order. Please try again.';btn.disabled=false;btn.textContent='Place order';return;
    }
    S.done={r:res.j,c:body};setBag([]);load();go('/done',true);
  }).catch(function(){err.textContent='Could not reach the shop. Check your connection and try again.';btn.disabled=false;btn.textContent='Place order';});
}
function done(){
  if(!S.done){go('/shop',true);return;}
  var r=S.done.r,c=S.done.c;
  var text='Hi Mountain Thrifters! I have placed order '+r.orderId+'.\n'+(r.items||[]).map(function(i){return '- '+i.name+(i.size?' ('+i.size+')':'')+' '+rs(i.price);}).join('\n')+
    '\nTotal: '+rs(r.total)+'\nPaying by UPI now.\nName: '+c.name+'\nPhone: '+c.phone+'\nDeliver to: '+c.address+', '+[c.city,c.pincode].filter(Boolean).join(' ');
  var upi=r.upiId?'upi://pay?pa='+encodeURIComponent(r.upiId)+'&pn='+encodeURIComponent(r.upiName)+'&am='+r.total+'&cu=INR&tn='+encodeURIComponent('Order '+r.orderId):'';
  app.innerHTML='<div class="wrap page"><div class="narrow"><div class="eye">Order '+esc(r.orderId)+' / held for you</div><h1 style="margin-top:10px">Thanks, '+esc(String(c.name).split(' ')[0])+'. Two quick steps.</h1>'+
  '<div class="step"><div class="fl">Step 1</div><p>Send us your order on WhatsApp so we can confirm it.</p><a class="btn wa wide" href="'+esc(waLink(text))+'" target="_blank" rel="noopener">Send order on WhatsApp</a></div>'+
  '<div class="step"><div class="fl">Step 2</div>'+(upi?'<p>Pay '+rs(r.total)+' by UPI to</p><p class="upi">'+esc(r.upiId)+'</p><a class="btn pop wide" href="'+esc(upi)+'">Open my UPI app</a><p class="dim" style="font-size:14px;margin:14px 0 0">On a computer? Pay to the UPI ID above from your phone.</p>':'<p style="margin:0">We will send you the payment details on WhatsApp.</p>')+'</div>'+
  '<p class="mute">We confirm on WhatsApp once the payment lands, then ship from Manali.</p></div></div>';
}

// ----- sell and feed -----
function sell(){
  app.innerHTML='<div class="wrap page"><div class="two"><div><div class="eye">Sell with us</div><h1 style="margin-top:10px">Give your gear a second run</h1><p class="mute">Jackets, boots, packs, tents, anything built for the outdoors. One piece from your cupboard or bulk stock from your store. Tell us what you have and we reply on WhatsApp with an offer.</p>'+
  '<div class="cols" style="grid-template-columns:1fr;gap:20px;margin-top:32px"><div><h3>1. Send the details</h3></div><div><h3>2. Get an offer</h3></div><div><h3>3. Get paid by UPI</h3></div></div></div>'+
  '<form id="sf"><label for="s-name">Your name</label><input id="s-name" name="name" required><label for="s-city">Where are you?</label><input id="s-city" name="city">'+
  '<label for="s-kind">What are you selling?</label><select id="s-kind" name="kind"><option>A few pieces of my own</option><option>Bulk or wholesale stock</option></select>'+
  '<label for="s-what">Tell us about it</label><textarea id="s-what" name="what" placeholder="Brand, what it is, size, condition" required></textarea>'+
  '<button class="btn wa wide" style="margin-top:20px">Send on WhatsApp</button><p class="dim" style="font-size:14px">WhatsApp opens with your message written. Add your photos there and press send.</p></form></div></div>';
}
function feed(){
  app.innerHTML='<div class="wrap page"><div class="shead"><div><div class="eye">@mountain_thrifters</div><h1 style="margin-top:10px">Instagram</h1></div><a class="btn ghost" href="https://www.instagram.com/mountain_thrifters/" target="_blank" rel="noopener">Follow us</a></div><div id="fg" class="mute">Loading the feed…</div></div>';
  (S.ig?Promise.resolve():loadIg('')).then(drawFeed);
}
function drawFeed(){
  var el=document.getElementById('fg');if(!el)return;
  if(!S.ig.length){el.innerHTML='<div class="empty">The feed is on its way here. For now, see everything on <a href="https://www.instagram.com/mountain_thrifters/" target="_blank" rel="noopener">Instagram</a>.</div>';return;}
  el.className='';el.innerHTML='<div class="ig big">'+S.ig.map(igTile).join('')+'</div>'+(S.igNext?'<div style="text-align:center;margin-top:32px"><button class="btn ghost" type="button" data-igmore>Load more</button></div>':'');
}

// ----- routing -----
var TITLES={shop:'Shop thrifted outdoor gear',sell:'Sell your outdoor gear',feed:'Instagram feed',bag:'Your bag',checkout:'Checkout',done:'Order placed'};
function render(){
  var path=location.pathname.replace(/\/+$/,'')||'/',name=path.split('/')[1]||'home';
  document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-nav')===name);});
  if(path==='/')home();
  else if(path==='/shop')shop();
  else if(path.indexOf('/p/')===0)product(decodeURIComponent(path.slice(3)));
  else if(path==='/bag')bagView();
  else if(path==='/checkout')checkout();
  else if(path==='/done')done();
  else if(path==='/sell')sell();
  else if(path==='/feed')feed();
  else home();
  if(TITLES[name])document.title=TITLES[name]+' · The Mountain Thrifters';
  if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t){t.scrollIntoView();return;}}
}
function go(url,replace){history[replace?'replaceState':'pushState'](null,'',url);render();if(!location.hash)window.scrollTo(0,0);}
window.addEventListener('popstate',render);
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-link],[data-f],[data-clear],[data-add],[data-remove],[data-pic],[data-igmore]');
  if(!t)return;
  if(t.hasAttribute('data-link')){if(e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();go(t.getAttribute('href'));return;}
  if(t.hasAttribute('data-f')){var f=getF(),k=t.getAttribute('data-f');f[k]=t.getAttribute('data-v');if(k==='cat')f.sub='';setF(f);return;}
  if(t.hasAttribute('data-clear')){history.replaceState(null,'','/shop');shop(true);return;}
  if(t.hasAttribute('data-add')){var ids=bag(),id=t.getAttribute('data-add');if(ids.indexOf(id)<0)ids.push(id);setBag(ids);product(id);return;}
  if(t.hasAttribute('data-remove')){setBag(bag().filter(function(x){return x!==t.getAttribute('data-remove');}));bagView();return;}
  if(t.hasAttribute('data-pic')){var p=S.products.filter(function(x){return '/p/'+encodeURIComponent(x.id)===location.pathname;})[0];if(p)document.getElementById('mainpic').innerHTML=pic(p,t.getAttribute('data-pic'));document.querySelectorAll('.thumbs button').forEach(function(b){b.classList.toggle('on',b===t);});return;}
  if(t.hasAttribute('data-igmore')){t.disabled=true;loadIg(S.igNext).then(drawFeed);}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='co'){e.preventDefault();placeOrder(e.target);}
  if(e.target.id==='sf'){e.preventDefault();var d=new FormData(e.target);
    window.open(waLink('Hi Mountain Thrifters! I have gear to sell.\nName: '+d.get('name')+'\nCity: '+(d.get('city')||'')+'\nSelling: '+d.get('kind')+'\nDetails: '+d.get('what')+'\nPhotos coming next.'),'_blank','noopener');}
});
bagCount();
load().then(render);
})();
</script>
</body>
</html>
